name: gds-sky130
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      save_snapshots:
        description: 'Save per-iteration routing snapshots for animation (~15 GB)'
        type: boolean
        default: false

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Generate SystemVerilog
        run: nix develop --command make generate_verilog

      - name: Build GDS (Sky130)
        uses: TinyTapeout/tt-gds-action@ttsky26a
        with:
          pdk: sky130A
        env:
          DRT_SAVE_SNAPSHOTS: ${{ inputs.save_snapshots && '1' || '0' }}

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck (Sky130)
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Generate SystemVerilog
        run: nix develop --command make generate_verilog

      - name: GL test (Sky130)
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26a
        env:
          CLOCK_MHZ: 4


