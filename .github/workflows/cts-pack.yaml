name: cts-pack
# Runs a CTS pack built on the workstation (scripts/cts_pack.sh), one job per shard. The pack and
# its shards.json are assets of the release named by `tag`. Started by hand only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release holding cts-pack.tar.zst and shards.json
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p shards.json
          echo "shards=$(cat shards.json)" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Fetch and unpack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p cts-pack.tar.zst
          tar --zstd -xf cts-pack.tar.zst
          sudo tar -xf pack/nix-closure.tar -C /
      - name: Run
        run: pack/scripts/cts_pack_shard.sh "${{ matrix.shard }}" out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out/${{ matrix.shard }}.tar.zst
          retention-days: 14

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - name: Merge
        run: |
          mkdir -p merged
          for t in shards/*.tar.zst; do
            s=$(basename "$t" .tar.zst)
            mkdir -p "merged/$s" && tar --zstd -xf "$t" -C "merged/$s" results.txt summary.txt manifest.env
          done
          cat merged/*/results.txt | sort -k2 > results.txt
          { echo "shards: $(ls shards | wc -l)"; head -6 "$(ls -d merged/* | head -1)/manifest.env"
            awk '{n[$1]++} END{for (k in n) printf "%-22s %d\n", k, n[k]}' results.txt | sort; } | tee summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results.txt
            summary.txt
          retention-days: 90
