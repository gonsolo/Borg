name: fpga

on:
  push:
    # Comment out (or remove) the following line to run the FPGA workflow on every push:
    # branches: none
  workflow_dispatch:

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Create FPGA bitstream
        run: nix develop --command make -C fpga borg.bin

      - name: Upload bitstream
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpga_bitstream
          path: fpga/borg.bin
