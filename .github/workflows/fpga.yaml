name: fpga
on:
  push:
    # Comment out (or remove) the following line to run the FPGA workflow on every push:
    # branches: none
  workflow_dispatch:

jobs:
  fpga:
    runs-on: [self-hosted, gonsolo-workstation]
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Print tool versions
        run: |
          echo "=== nixpkgs rev (from flake.lock) ==="
          nix flake metadata --json | python3 -c "import sys,json; m=json.load(sys.stdin); print(m['locks']['nodes']['nixpkgs']['locked']['rev'])"
          echo "=== Tool versions ==="
          nix develop --command bash -c "nextpnr-ecp5 --version; yosys --version"

      - name: Generate ULX3S Verilog (full SoC — Hutt + Borg + MemoryController)
        run: nix develop --command bash -c "make generate_verilog_ulx3s"

      - name: Upload generated Verilog
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpga_verilog
          path: out/ulx3s/verilog/
