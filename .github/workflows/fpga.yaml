name: fpga
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    # Comment out (or remove) the following line to run the FPGA workflow on every push:
    # branches: none
  workflow_dispatch:

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Print tool versions
        run: |
          echo "=== nixpkgs rev (from flake.lock) ==="
          nix flake metadata --json | python3 -c "import sys,json; m=json.load(sys.stdin); print(m['locks']['nodes']['nixpkgs']['locked']['rev'])"
          echo "=== Tool versions ==="
          nix develop --command bash -c "nextpnr-ice40 --version; yosys --version"

      - name: Create FPGA bitstream
        run: nix develop --command bash -c "make generate_verilog && make -C fpga borg.bin"

      - name: Upload bitstream
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpga_bitstream
          path: fpga/borg.bin
