name: fpga

on:
  push:
    # Comment out (or remove) the following line to run the FPGA workflow on every push:
    # branches: none
  workflow_dispatch:

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Generate SystemVerilog
        run: nix develop --command make generate_verilog

      - name: Checkout tt-support-tools
        uses: actions/checkout@v4
        with:
          repository: TinyTapeout/tt-support-tools
          path: tt
          ref: main

      - name: Install tt-support-tools dependencies
        run: nix develop --command pip install --user --no-deps configupdater python-frontmatter

      - name: Create user config
        run: nix develop --command python tt/tt_tool.py --create-user-config

      - name: Create FPGA bitstream
        env:
          TT_FPGA_FREQ: 4
        run: nix develop --command python tt/tt_fpga.py harden

      - name: Upload bitstream
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpga_bitstream
          path: |
            build/*
            docs/*
            src/*
            info.yaml
            LICENSE
