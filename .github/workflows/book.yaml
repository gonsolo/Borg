name: book
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Build book (resolve snippets)
        run: |
          sudo apt-get install -y python3-graphviz graphviz
          python3 docs/build_book.py

      - name: Convert book to HTML
        run: |
          sudo apt-get install -y pandoc
          mkdir -p _site

          cat > mermaid_init.html << 'EOF'
          <script type="module">
            import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
            document.addEventListener("DOMContentLoaded", () => {
              document.querySelectorAll("pre.mermaid code").forEach(code => {
                const pre = code.parentElement;
                pre.textContent = code.innerText; // Automatically un-escapes &gt; to >
              });
              mermaid.initialize({ startOnLoad: true, theme: "dark" });
            });
          </script>
          EOF
          for f in docs/book/*.md; do
            base=$(basename "$f" .md)
            pandoc "$f" -s --toc --metadata title="Borg GPU" \
              --css=style.css -H mermaid_init.html -o "_site/${base}.html"
          done
          cp docs/triangle.png _site/ 2>/dev/null || true
          cp docs/hw_diagram.svg _site/ 2>/dev/null || true
          cp docs/gds_render_small.png _site/ 2>/dev/null || true
          if [ -d "docs/book/images" ]; then cp -r docs/book/images _site/; fi

          cat > _site/style.css << 'ENDCSS'
          body { max-width: 800px; margin: 2rem auto; padding: 0 1rem;
                 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
                 line-height: 1.7; color: #c9d1d9; background: #0d1117; }
          h1 { color: #e6edf3; border-bottom: 1px solid #21262d; padding-bottom: 0.3em; }
          h2 { color: #e6edf3; margin-top: 2em; border-bottom: 1px solid #21262d; padding-bottom: 0.3em; }
          h3 { color: #e6edf3; }
          a { color: #58a6ff; text-decoration: none; }
          a:hover { text-decoration: underline; }
          pre { background: #161b22; padding: 1rem; border-radius: 6px;
                overflow-x: auto; border: 1px solid #30363d; }
          code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
                 font-size: 0.85em; background: #161b22; padding: 0.2em 0.4em; border-radius: 3px; }
          pre code { background: none; padding: 0; }
          table { border-collapse: collapse; width: 100%; margin: 1em 0; }
          th, td { border: 1px solid #30363d; padding: 0.5rem 0.75rem; text-align: left; }
          th { background: #161b22; font-weight: 600; }
          tr:nth-child(even) { background: #161b22; }
          img { max-width: 100%; image-rendering: pixelated; }
          nav#TOC { background: #161b22; padding: 1em; border-radius: 6px;
                    margin-bottom: 2em; border: 1px solid #30363d; }
          nav#TOC a { color: #58a6ff; }
          hr { border: none; border-top: 1px solid #21262d; }
          ENDCSS

          echo '<meta http-equiv="refresh" content="0; url=00_index.html">' > _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
