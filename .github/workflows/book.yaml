name: book

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build book (resolve snippets)
        run: python3 docs/build_book.py

      - name: Convert book to HTML
        run: |
          sudo apt-get install -y pandoc
          mkdir -p _site

          for f in docs/book/*.md; do
            base=$(basename "$f" .md)
            pandoc "$f" -s --toc --metadata title="Borg GPU" \
              --css=style.css -o "_site/${base}.html"
          done
          cp docs/triangle.png _site/ 2>/dev/null || true

          cat > _site/style.css << 'ENDCSS'
          body { max-width: 800px; margin: 2rem auto; padding: 0 1rem;
                 font-family: 'Segoe UI', -apple-system, sans-serif; line-height: 1.7;
                 color: #333; background: #fafafa; }
          h1 { color: #1a1a2e; border-bottom: 2px solid #e94560; padding-bottom: 0.3em; }
          h2 { color: #1a1a2e; margin-top: 2em; }
          h3 { color: #444; }
          a { color: #0969da; text-decoration: none; }
          a:hover { text-decoration: underline; }
          pre { background: #f0f0f0; padding: 1rem; border-radius: 6px;
                overflow-x: auto; border: 1px solid #ddd; }
          code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.9em; }
          table { border-collapse: collapse; width: 100%; margin: 1em 0; }
          th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
          th { background: #f0f0f0; font-weight: 600; }
          img { max-width: 100%; image-rendering: pixelated; }
          nav { background: #f0f0f0; padding: 1em; border-radius: 6px; margin-bottom: 2em; }
          ENDCSS

          echo '<meta http-equiv="refresh" content="0; url=00_index.html">' > _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
