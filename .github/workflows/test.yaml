name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run tests
        run: |
          nix develop --ignore-environment --command make test-system
          # The above command includes generate_verilog

      - name: Test Summary
        uses: test-summary/action@v2.3
        with:
          paths: "test/soc/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/soc/sim_build/rtl/tb.fst
            test/soc/results.xml
            test/soc/sim_build/rtl/*.log

