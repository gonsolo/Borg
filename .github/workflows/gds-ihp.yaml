name: gds-ihp
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Generate SystemVerilog
        run: nix develop --command make generate_verilog

      - name: Build GDS (IHP)
        uses: TinyTapeout/tt-gds-action@ttihp26a
        with:
          pdk: ihp-sg13g2
          librelane-version: '3.0.8'

  gds-workstation:
    runs-on: [self-hosted, gonsolo-workstation]
    timeout-minutes: 300
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS (IHP, nix)
        run: nix develop --command make gds-ihp

      - name: Upload GDS + reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ihp-gds-workstation
          path: runs/wokwi/
          if-no-files-found: warn

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck (IHP)
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Generate SystemVerilog
        run: nix develop --command make generate_verilog

      - name: GL test (IHP)
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26a
        env:
          CLOCK_MHZ: 4


