name: gds-ihp
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# NOTE: the official hosted path (gds/precheck/gl_test, via
# TinyTapeout/tt-gds-action) is temporarily removed so this workflow's
# badge is gated by a single, fast job instead of paying for a redundant
# ~4-5h hosted run on every trigger. IHP is currently a diagnostic-only
# build anyway (8x4 tiles, not a real ttihp26b shuttle option; a
# CLOCK_UNCERTAINTY_CONSTRAINT not yet validated as sign-off-safe -- see
# src/config.json), so the official-format cross-check isn't buying much
# right now. Restore the gds/precheck/gl_test jobs (git log this file)
# once IHP is back to a real, submittable configuration.

jobs:
  gds-workstation:
    runs-on: [self-hosted, gonsolo-workstation]
    timeout-minutes: 300
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS (IHP, nix)
        run: nix develop --command make gds-ihp

      - name: Upload GDS + reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ihp-gds-workstation
          path: runs/wokwi/
          if-no-files-found: warn
