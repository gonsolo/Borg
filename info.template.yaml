project:
  title:        "Borg - Tiny GPU"
  author:       "Andreas Wendleder"
  discord:      "gonsolo"
  description:  "A RISC-V SoC with a GPU featuring vertex shading, rasterization, and RGB fragment shading"
  language:     "Chisel"
  clock_hz:     0

  tiles: {{tiles}}

  top_module:  "tt_um_gonsolo_borg"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update this list when Chisel generates new Verilog modules.
  source_files:
{{source_files}}

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "Interrupt 0"
  ui[1]: "Interrupt 1"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: "UART RX"

  # Outputs
  uo[0]: "UART TX"
  uo[1]: "UART RTS"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: "Debug UART TX"
  uo[7]: "Debug signal / PWM"

  # Bidirectional pins
  uio[0]: "Flash CS"
  uio[1]: "SD0"
  uio[2]: "SD1"
  uio[3]: "SCK"
  uio[4]: "SD2"
  uio[5]: "SD3"
  uio[6]: "RAM A CS"
  uio[7]: "RAM B CS / PWM"

# Do not change!
yaml_version: 6
