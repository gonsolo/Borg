meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Render the layout after sealring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top

# SWITCHED TO 3.3V 2026-09-10. This is the shipping decision recorded
# 2026-09-01 (project_borg_only_bridge_status memory: "ship 3.3V, no level
# shifters") -- the CoB board shorts only ground between power pins, so
# 3.3V is a free choice with no level-shifter cost, and it's what the real
# ULX3S link target needs. Validated first on a throwaway probe harness
# (librelane/probe_borgonly_3v3.yaml, Phase 0: 71.55% util, 0 setup/hold
# violations at all 9 corners at 25 MHz -- vs 5V, which closes but loses on
# every axis: 76.68% util, 3763 vs 398 Max Slew violations) before landing
# here on the real production config. SAME standard-cell library
# (gf180mcu_fd_sc_mcu7t5v0) and SAME io pad cells (gf180mcu_fd_io) as
# before -- this is a different characterization corner of the identical
# cells, not a library swap, so none of the physical (PDN/padring/GDS)
# config below needed to change.
#
# This is ONE variable changed at a time on purpose: CLOCK_PERIOD stays at
# 125 (8 MHz) below, the value this config's hold/congestion/density tuning
# was measured against at 5V. 3.3V cells are ~1.7-2.1x faster (measured
# separately, project_borg_ii_fp32_measurements memory) -- a strong
# candidate for finally closing the 25 MHz target the comment below
# documents as blocked by 5V's slow-corner timing, but that is a second,
# separate experiment once this one is confirmed clean at 8 MHz. The
# congestion half of the 25 MHz blocker (global routing, not timing) is
# unrelated to voltage and will not be fixed by this change alone.
#
# Needed alongside LIB below: SYNTH_CORNER stayed None even with --manual-pdk
# args passed, and filter_views() can't pick a LIB entry without it -- same
# "Missing -liberty" error even with LIB correctly populated.
SYNTH_CORNER: nom_tt_025C_3v30

# Needed for OpenROAD physical steps (Floorplan, CheckMacroInstances, ...):
# DEFAULT_CORNER is normally auto-derived as "nom_{default_pvt}" by
# pdk_compat.py, but that derivation only runs in Ciel-managed (non
# --manual-pdk) mode. Left unset, it stays the bare "nom_" prefix, which
# doesn't match any LIB glob key below ("*_tt_025C_3v30" etc.) -- so
# _CURRENT_CORNER_NAME resolves to "nom_", zero liberty loads, and EVERY
# std cell (not just one) reports "no liberty cell" / "not found" during
# floorplan init (e.g. SYNTH_TIELO_CELL's gf180mcu_fd_sc_mcu7t5v0__tiel/ZN --
# the cell is fully characterized in the .lib file, it just never got
# loaded). LIB's own docstring says exactly one entry must match
# DEFAULT_CORNER -- this makes that true.
DEFAULT_CORNER: nom_tt_025C_3v30

# The PDK's default STA_CORNERS lists only the 5V corner names, so the 3.3V
# corner names must be listed here too or "nom_tt_025C_3v30" can't be found
# and DFFLIBMAP fails with a misleading "Missing -liberty" error (hit once
# on the probe harness, see probe_borgonly_3v3.yaml's comment -- fixed here
# before it could happen again on the real config).
STA_CORNERS:
- nom_tt_025C_3v30
- nom_ss_125C_3v00
- nom_ff_n40C_3v60
- min_tt_025C_3v30
- min_ss_125C_3v00
- min_ff_n40C_3v60
- max_tt_025C_3v30
- max_ss_125C_3v00
- max_ff_n40C_3v60

# Needed on LibreLane 3.0.3: --manual-pdk mode does not auto-populate LIB
# (standard-cell liberty files) from --scl/STD_CELL_LIBRARY the way non-manual
# (Ciel-managed) PDK resolution does -- without this, Yosys's DFFLIBMAP pass
# fails with "Missing -liberty liberty_file option!". Corners match
# STA_CORNERS' 3 unique suffixes (tt_025C_3v30/ss_125C_3v00/ff_n40C_3v60);
# nom_/min_/max_ prefixes there are wire-RC sub-corners sharing one liberty
# file each.
LIB:
  "*_tt_025C_3v30":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib
  "*_ss_125C_3v00":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib
  "*_ff_n40C_3v60":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib

# Needed on LibreLane 3.0.3: --pad on the CLI does not auto-inject the io pad
# library's blackbox Verilog models into synthesis -- without this, io pad
# cell references (gf180mcu_fd_io__in_c, __in_s, __bi_24t, __asig_5p0, etc.)
# fail hierarchy checks as "not part of the design". PAD_VERILOG_MODELS
# (librelane/steps/pyosys.py's VerilogStep) is only consumed when the step's
# power_defines=True, which the plain Yosys.Synthesis step doesn't set --
# EXTRA_VERILOG_MODELS is the unconditional equivalent, so use that instead.
EXTRA_VERILOG_MODELS:
- pdk_dir::libs.ref/gf180mcu_fd_io/verilog/gf180mcu_fd_io__blackbox_pp.v

# LibreLane 3.0.3 bug (still present on the dev branch as of 2026-04):
# PAD_LIBS is declared Dict[str, List[Path]] (corner-pattern -> libs, same
# shape as LIB), but common/io.tcl's read_timing_info does a flat
# `foreach lib $::env(PAD_LIBS)` with no corner-filtering step (unlike LIB,
# which gets resolved to _CURRENT_CORNER_LIBS first). A dict serializes to
# Tcl as an interleaved key/value list, so the loop trips over the literal
# corner-glob keys (e.g. "*_tt_025C_5v00") as if they were liberty file
# paths -- "Error: cannot read file *_tt_025C_5v00." We don't need gpio pad
# timing accuracy for an area measurement, so just skip loading it.
#
# 2026-09-05: "we don't need it for an area measurement" was true, and became
# actively misleading the moment this config was used for anything else. With
# no timing model for the clock pad, the clock cannot propagate from clk_PAD
# through gf180mcu_fd_io__in_s into the core, so STA reports "11987 unclocked
# register/latch pins", analyses ZERO paths, and then reports zero setup/hold
# violations in every corner -- indistinguishable from a design that closes
# timing. Every timing number this flow produced was vacuous: a 4 MHz run and
# a 25 MHz run gave byte-identical design__instance__area, because the
# timing-driven resizer had no paths to work on. Reported upstream as
# librelane/librelane#1028, fix submitted as #1029.
#
# EXTRA_LIBS is the workaround until that merges: it is declared
# Optional[List[Path]], matching how io.tcl actually iterates it, unlike
# PAD_LIBS's Dict[str, List[Path]]. It is "loaded indiscriminately for all
# timing corners", so the pad is modelled at one corner everywhere -- second
# order for a buffer on the clock path (insertion delay largely cancels
# between launch and capture) and far better than no clock at all.
PAD_LIBS: null
EXTRA_LIBS:
- pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__tt_025C_3v30.lib

# VERILOG_FILES lives in librelane/generated_sources.yaml now (generated by
# scripts/gen_librelane_sources.py from BorgOnlyTop's actual emitted module
# list) -- not here. The old hand-maintained list drifted out of sync for
# real more than once (Hutt/Peripherals/QspiBackend/uart_* don't even exist
# in this target's output; the rgbzMem->rgbzMems MSAA rename needed a manual
# patch). See asic/wafer.space/Makefile's LIBRELANE_CONFIGS.

# Enable plugin for better SystemVerilog support
# USE_SLANG: True
# SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__logo
- gf180mcu_ws_ip__marker

# Clock
# CLOCK_PERIOD at the end of this block is the tapeout's signoff clock: 125 ns
# (8 MHz). It is the only place the tapeout clock is set -- BorgOnlyTop has no
# CLOCK_MHZ parameter (that env var only sizes SoC peripherals such as the UART
# baud divisor, in the Tiny Tapeout and simulation SoCs). History: this started at
# 250 ns (4 MHz), the old Tiny Tapeout clock target; the notes below record the
# probing that led to 8 MHz.
#
# 25 MHz (40ns, the wafer.space template's own default) was tried on 1x1 with
# real timing analysis on 2026-09-05 and does NOT close. Two independent
# blockers, both measured:
#
#  1. Slow-corner timing. At nom_tt_025C_5v00 the design just makes it
#     (+0.211 ns slack), but at nom_ss_125C_4v50 it is -149.83 ns with
#     -660k TNS -- roughly a 192 ns path against a ~42 ns requirement. Signoff
#     needs every corner, so the typical-corner pass is meaningless on its own.
#     The critical path starts at BorgSequencer's FSM state register
#     (i_chip_core.i_borg.core.borgCore.sequencer.state[2]) with ~85 ns of
#     combinational decode behind it -- NOT the FMA. Closing 25 MHz means
#     restructuring that decode, not adding FMA pipeline stages.
#  2. Clock routing congestion. Global routing entered congestion overtime
#     ("extra iteration N/50") on clk_PAD2CORE / clknet_0_clk_PAD2CORE and was
#     still grinding after 3.5 h, despite only 31% cell utilisation -- the
#     25 MHz clock tree plus 1x1's taller aspect ratio (3048x4238 vs 1x0.5's
#     3048x1647). This is independent of the logic-depth problem and would
#     still need solving (floorplan / PDN / clock strategy) even if (1) were.
#
# 4 MHz remains what this design actually closes. Raise it again only
# alongside the sequencer restructuring, and expect to revisit congestion.
# Currently probing upward from 4 MHz to find where the design actually
# breaks, rather than jumping to the 25 MHz target. Predicted slow-corner
# ceiling from the 25 MHz run's measured ~192 ns ss-corner path is ~5.2 MHz,
# so 8 MHz is expected to miss by ~67 ns at nom_ss_125C_4v50 -- running it to
# test that model, since the resizer may find different tradeoffs at a less
# extreme target. ALWAYS check nom_ss_125C_4v50, not nom_tt_025C_5v00: at
# 25 MHz the typical corner passed (+0.211 ns) while ss was -149.83 ns.
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
# 2026-09-20: 125 -> 200 ns (8 -> 5 MHz), the tapeout's signoff clock.
#
# Measured, not predicted: RUN_2026-09-20 ended post-CTS repair at -49.686 ns
# on max_ss_125C_3v00, so the slow-corner path is ~174.7 ns (= 125 + 49.686)
# -> 5.72 MHz. That lands almost exactly on the ~5.2 MHz ceiling the 25 MHz
# probe above predicted from its ~192 ns ss-corner path, which is the third
# independent measurement agreeing that this design is a ~5 MHz part at 3.3V.
#
# 200 ns rather than 180: 180 would leave only ~5 ns of margin, and the
# slow-corner number moved 8 ns (-41.9 -> -49.7) between two runs that
# differed ONLY in placement density -- 5 ns is inside the run-to-run noise.
# The extra slack also feeds back into routing: less timing pressure means the
# resizer inserts fewer repair buffers, which is the area that congests.
#
# Still to watch: at 25 MHz the critical path was sequencer.state[2] with ~85 ns
# of combinational decode, NOT the FMA. That path has not been addressed and may
# resurface now that the FMA (fmaStages=4) and the texture blend are out of the
# way. ALWAYS check max_ss_125C_3v00, never the typical corner.
CLOCK_PERIOD: 200 # 5 MHz

# CTS
#
# 2026-09-06: tried CTS_APPLY_NDR: none (down from LibreLane's default
# "half") on the theory that clock-net NDR spacing demand, concentrated near
# a corner pad on a non-square die, was the congestion source. 2026-09-07:
# disproven -- a real spatial analysis of the congestion report (parsing
# GRT's per-violation bboxes and net lists, not just the aggregate table)
# showed the hotspot is nowhere near the padring: it's a small region deep
# in the core (~1350, 3660 um) dominated by logic nets from
# BorgSequencer's Pass-2 (sequencer.p2) and the rasterizer dispatcher
# (rast.dispatcher), not clock nets. CTS_APPLY_NDR: none did not move that
# hotspot. Left at LibreLane's default -- the real fix was
# PL_TARGET_DENSITY_PCT below.

# Overfix hold violations
#
# 2026-09-07/08: with congestion resolved (PL_TARGET_DENSITY_PCT above),
# a full signoff run at 8MHz got all the way through routing/DRC/LVS clean
# and hit exactly one residual hold violation at final multi-corner STA:
# bidir_PAD[6] -> _142734_/D, -7.8ps (tt) / -13.3ps (ss). A single I/O-pad
# input path, not a congestion-related failure -- the earlier resizer hold
# repair passes run on estimated (pre-route) parasitics, and this path's
# actual routed delay came in a few ps short of what they targeted.
# 0.35/0.3 -> 0.45/0.4 buys ~100ps of extra margin during those earlier
# passes, comfortably covering the observed shortfall.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.45
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.4

# 2026-09-07: 35 -> 25. Root-caused a persistent local-congestion failure
# (global routing never converging, up to Max H/V 55/86 at one hotspot) to
# a genuine local density problem, not a padring/clock-tree effect: wide
# buses (covDeltaCache, the rasterizer dispatcher's edge-value registers)
# crossing the BorgSequencer Pass-2 / rasterizer-dispatcher boundary get
# placed tightly together, leaving no local routing headroom even though
# average core utilization is only ~34-41%. Confirmed by a clean,
# genuinely-fresh (non-resumed) run: at 25% target density, the same
# congestion report shows 0/0 Max H/V on every layer, global routing
# converges in ~40s (was 3h+ and never converging at 35%). An earlier
# attempt at this same fix appeared to hit an OpenROAD crash and get
# clamped back near 35% regardless of the requested value -- both were
# artifacts of testing via LibreLane run-tag resumption (`-F` rewinding
# into an already-fully-completed run directory), not real, reproducible
# under a normal single fresh flow. Don't resume-test placement-sensitive
# config changes this way again -- always verify with a fresh run.
#
# 2026-09-16: 25 -> 45. The 25% above was correct for the design that was
# here on 09-07 and became INVALID, not merely suboptimal, once Default
# gained FP32 + blend/stencil/bilinear: a target density BELOW the design's
# own utilization is physically unsatisfiable, and that is what the 1x1
# signoff run RUN_2026-09-16_00-21-32 hit.
#
#   run                     util (25-globalplacementskipio)  target  outcome
#   FP16      09-08          22.8%                            25%    PASSED
#   FP32+feat 09-16          34.8%                            25%    DPL-0036
#
# OpenROAD said so itself and overrode the value -- "[GPL-0302] Target
# density 0.2500 is too low for the available free area. Automatically
# adjusting to uniform density 0.3200" -- but even its own 32% override is
# still below the 34.8% the cells actually occupy, so global placement ran
# with ~zero local slack and OpenROAD.RepairDesignPostGPL then had nowhere
# to legalize the ~826 buffers it inserted (DPL-0036, 1000+ DPL-0035).
#
# Not a fanout problem, which is where this investigation started: the
# MAX_FANOUT_CONSTRAINT of 10 (a LibreLane default, unset here) is the same
# value the PASSING 09-08 run used, and that run inserted and legalized
# 9,972 fanout-repair buffers without complaint -- 12x more than the run
# that failed. The tile-buffer read-index nets do carry ~1,200 loads each
# (12 plane memories -- 4 rgbz + 4 stencil + 4 alpha -- share one 4-bit
# index and 224 bits of read mux, all read in the same cycle), and that is
# real architectural debt worth paying down later by serializing the
# per-sample reads the way sTileWrite already serializes writes. But it is
# pre-existing and was tolerated; it is not what broke this run.
#
# 2026-09-16, second correction: 45 -> 70. The 45 above was sized against the
# WRONG number and failed identically (RUN_2026-09-16_09-42-09, DPL-0036 at
# the same step 31, 4h12m). It did fix what it was aimed at -- GPL-0302 is
# gone, global placement no longer runs under an impossible target -- but
# 34.8% is utilization at GLOBAL placement, BEFORE
# OpenROAD.RepairDesignPostGPL inserts its buffers. The figure that governs
# legalization is utilization at DETAILED placement, which DPL-0006 reports
# outright:
#
#   run                 core area    instance area @ DPL   util @ DPL
#   FP16      09-08     12,901,980   4,699,087             36.4%   PASSED
#   FP32+feat 09-16     12,901,980   7,432,776             57.6%   DPL-0036
#
# Repair grows instance area ~60% in BOTH runs (4,488,350 -> 7,432,776 here),
# so that expansion is not the regression -- the starting point is. Targeting
# 45% against 57.6% of actual content is the same contradiction as targeting
# 25% against 34.8%, one number up. 70% clears 57.6% with real headroom and is
# ordinary for an ASIC, where 60-80% is typical.
#
# The failure shape agrees: the second run failed on 2306 instances (DPL-0034)
# now mostly ordinary cells rather than mostly fanout buffers, i.e. "no room
# anywhere" rather than "one pathological net".
#
# EXPECT TO REVISIT ROUTING CONGESTION -- more so at 70 than at 45. This is
# far above the 35% that failed global routing on 09-07, on a smaller and
# structurally different netlist. If routing starts grinding on "extra
# iteration N/50", the hotspot to check is the BorgSequencer Pass-2 /
# rasterizer-dispatcher boundary named above, and the better lever then is
# MAX_FANOUT_CONSTRAINT (a LibreLane default of 10, unset here, and very
# strict for a 125 ns clock): relaxing it cuts the ~60% repair expansion at
# the source, reducing area AND routing demand together, rather than making
# room for it. Left alone for now because the density number is the MEASURED
# blocker and the 09-08 run proves the flow tolerates that buffer count.
# 2026-09-20, third correction: 70 -> 50. The 70 above was sized against
# 57.6% utilization. After the reset fan-out fix (d6d98c67) the design sits at
# 42.7% util @ DPL (instance area 5,511,142 of 12,901,980 um^2), so 70 became
# the OPPOSITE of the error it was fixing: a target 27 points ABOVE actual
# content, which tells the global placer to pack cells and leave whitespace.
#
# Measured on RUN_2026-09-19's placed DEF, cell counts over a 12x16 grid of
# the core:
#
#     ..o###o.....      '#' >1.5x mean cell count
#     ..######....      '.' <0.5x
#     ..+######+..      max bin 2247 (2.92x mean)
#     ..o####+oo#.      min bin 1    (0.00x mean)
#     ...+#######.
#     ........o+o.
#
# ~a quarter of the die (two left columns, right edge, bottom row) is empty
# while the centre-right runs at ~70% LOCAL density -- exactly this target.
# That is the "localized congestion" global routing has died on three times
# (2.10% of tiles overflowed at 42.7% average utilization; the FP16 run that
# routed in 51 s had 1.43% and 7x less total overflow).
#
# 50 keeps this comment's own rule -- target above actual with headroom --
# against the utilization the design ACTUALLY has now. Shrinking the RTL would
# not have helped: at target 70 a smaller design is packed into a
# proportionally smaller blob at the same local density.
PL_TARGET_DENSITY_PCT: 50
# 2026-09-06: was true. Confirmed by a real failure this session that this
# was masking, not tolerating, a genuine problem: global routing "finished"
# with congestion never actually resolved (flat ~1.5% overflow across 6-7
# full 50-iteration congestion-repair passes, 7.5h), the flow walked forward
# anyway because this flag permits it, and detailed routing then hard-failed
# hours later on the exact nets GRT never found a legal path for
# (DRT-0218 "Guide is not connected to design"). false makes that same
# failure surface in minutes at global routing instead of hours later at
# detailed routing -- doesn't fix the congestion, but makes iterating on a
# real fix far cheaper than paying the multi-hour tax every attempt.
# 2026-09-20: 0.3 -> 0.18. This is the global router's pessimism margin -- it
# pretends this fraction of every layer's tracks is unavailable, as headroom for
# detailed routing. 0.3 is a LibreLane default, never sized for a PDK with only
# FOUR usable routing layers (GF180 has 5; Metal1 contributes zero routing
# resource, it is consumed by cells and pins).
#
# Four runs have now died in global routing, all with the same signature: strip
# an NDR from a clock net (GRT-0273), restart the 50-iteration loop, fail again.
# Every DEMAND-side fix improved its own metric and left routing untouched --
# fmaStages=4 cut violating endpoints 26% and placement overflow 22% and still
# stalled at iteration 18. The one thing that moved the wall was placement
# density (70 -> 50, wall 18 -> 21-28). This is the only untried lever that adds
# routing SUPPLY rather than rearranging demand.
#
# 2026-09-21: SOLVED, and the paragraph above had the wrong model. GRT_ADJUSTMENT
# applies UNIFORMLY to all five routing layers. Borg's demand is not uniform --
# it is 78% on Metal2/Metal3, with Metal4 at 15.1% and Metal5 at 7.8% usage. So
# the 18% haircut was removing capacity from the two layers that had slack and
# doing nothing about the two that were tight. The congestion was never a global
# shortage: total routing usage was 24.4%, and all 2,114 congested tiles sat in
# ONE 756x782 um box (4.6% of the core) whose local utilization was 15.7% vs the
# 43.1% chip average -- routability-driven placement had already evacuated it.
#
# Measured by re-running global routing from a saved post-CTS ODB (a 1-5 minute
# loop; see project_grt_adjustment_is_the_cause in Claude's memory for the
# recipe -- it replaces 6-hour signoff runs for any routing change). All points
# at REAL signoff conditions: 50 iterations, GRT_ALLOW_CONGESTION false.
#
#   M2/M3 derate (M4/M5 free)   overflow   result
#   0.00                               0   converges, but detailed routing then
#                                          produced 90% SHORTS (118,422 on
#                                          Metal2) -- too optimistic, as this
#                                          variable exists to prevent
#   0.02                               0   converges
#   0.05                               0   converges  <- CHOSEN
#   0.08                               9   fails
#   0.10                              11   fails
#   0.18                          31,400   fails (the old setting, 5h50m)
#
# 0.05 is the LARGEST derate that converges, so it concedes the least optimism
# of any setting that works, and it keeps real margin on Metal2/Metal3 where
# pin access and shorts actually occur. Metal4/Metal5 get 0 because they are
# measurably idle. Note the cliff between 0.10 (11 overflow) and 0.18 (31,400):
# the old value was far past the edge, which is why this looked structural.
#
# FOUR structural hypotheses were refuted by measurement before this was found
# -- macro hardening (made routing 11.5x WORSE), cell area (usage is 24.4%),
# high-fanout nets (repair_design caps fanout at 30 before routing), and long
# broadcast wires (295 um median span). Do not retry them.
#
# GRT_ADJUSTMENT MUST BE 0 HERE -- this is a trap. LibreLane's
# set_layer_adjustments.tcl runs
#     set_global_routing_layer_adjustment * $GRT_ADJUSTMENT
# FIRST and only then applies GRT_LAYER_ADJUSTMENTS per layer. A per-layer
# value of 0 does NOT undo the global one, so `GRT_ADJUSTMENT: 0.05` plus
# `[0, 0.05, 0.05, 0, 0]` silently derates ALL FIVE layers by 5% -- verified
# 2026-09-21 by the reduction table it printed: Metal4 7.54% and Metal5 11.70%
# although both were configured 0. With this fixed, Metal4/Metal5 report
# exactly 0.00% and Metal2/Metal3 report 7.53%/6.86% -- a 0.05 request
# QUANTISED UP to a whole routing track per tile, which is why the effective
# derate reads higher than the number requested (the sweep saw the same
# quantisation, so the two are consistent).
# Put every non-zero derate in the per-layer list and leave this at 0.
GRT_ADJUSTMENT: 0.0

# Per-layer, in order Metal1..Metal5. Metal1 carries no routing resource.
# Metal2/Metal3 keep a real margin (they absorb pin access and are where
# detailed routing produced its shorts); Metal4/Metal5 are measurably idle.
GRT_LAYER_ADJUSTMENTS: [0.0, 0.05, 0.05, 0.0, 0.0]

GRT_ALLOW_CONGESTION: false

# Allow a larger Y displacement
PL_MAX_DISPLACEMENT_Y: 200

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN
# pdn_cfg_borg.tcl is our fork of the template's pdn_cfg.tcl with the
# unconditional SRAM-macro PDN grid dropped -- Borg has no hard SRAM macros,
# so sourcing it hit [PDN-1030] Unable to find instance: i_chip_core.sram_0.
PDN_CFG: dir::pdn/pdn_cfg_borg.tcl
PDN_ENABLE_PINS: False

# PDN - Straps
#
# 2026-09-06: tried loosening VPITCH/HPITCH 75 -> 150 on the theory that the
# PDN grid was competing with clock-tree routing for track budget.
# 2026-09-07: disproven by the same spatial congestion analysis that ruled
# out CTS_APPLY_NDR above -- the hotspot is a core-interior logic-net
# cluster (BorgSequencer Pass-2 / rasterizer dispatcher), not something a
# PDN strap change would touch. Back to the tuned 75/75 defaults; the real
# fix was PL_TARGET_DENSITY_PCT below.
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3
# PDN_CORE_RING_CONNECT_TO_PAD_LAYERS (layer-specific variant) doesn't exist
# in LibreLane 3.0.3 -- only in dev. PDN_CORE_RING_CONNECT_TO_PADS above
# already connects the ring to pads (using 3.0.3's own default layer).

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Image render settings
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::gf180mcu_render.lyp

# DRC settings
# A high number of workers increases RAM usage,
# but can significantly improve the performance.
# workers * threads should equal the available
# hardware threads for a best possible utilization.
#
# 2026-09-22: workers=max (24, matching nproc on gonsolo-workstation) measured
# at ~2.1 GB RSS per worker on the msaa-jump signoff's KLAYOUT_DRC_OPTIONS run
# -- 52.5 GB across 25 processes on a 62 GB machine, which pushed the system
# 25 GB into swap with only 6 GB "available" while the run was live. The
# per-worker cost is roughly the same for the antenna and density decks too
# (same GDS, same engine), so all three were lowered together rather than
# just the one caught in the act. 8 keeps real parallelism (vs. THREADS=1's
# serial fallback) while landing around ~17 GB peak, leaving headroom for
# whatever else is running on the same machine. Runtime goes up somewhat
# in exchange -- raise this back toward `max` only on a machine with enough
# RAM to safely hold workers * ~2.1 GB.
KLAYOUT_DRC_THREADS: 1

KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup" # disable CUP for now
  variant: ref::$PDK
  workers: 8

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: 8

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: 8
